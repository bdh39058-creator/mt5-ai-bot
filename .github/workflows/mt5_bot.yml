name: MT5 Telegram Multi-Account Bot 24/7

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

concurrency:
  group: mt5-ai-telegram-bot
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: write
  actions: write

jobs:
  run-trading-bot:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: 0. Check Required Secrets
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ ${#TELEGRAM_BOT_TOKEN} -lt 20 ]; then
            echo "::error::السر TELEGRAM_BOT_TOKEN غير موجود أو غير صالح. أضفه من Settings > Secrets and variables > Actions > New repository secret"
            exit 1
          fi
          echo "✅ تم التحقق من مفتاح البوت بنجاح."

      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Install MetaTrader 5 and Python Packages
        shell: powershell
        run: |
          if (!(Test-Path "C:\Program Files\MetaTrader 5\terminal64.exe")) {
            Write-Host "Downloading and installing Official MetaTrader 5..."
            Invoke-WebRequest -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" -OutFile "mt5setup.exe"
            Start-Process -FilePath ".\mt5setup.exe" -ArgumentList "/auto" -PassThru
            $deadline = (Get-Date).AddMinutes(4)
            while (!(Test-Path "C:\Program Files\MetaTrader 5\terminal64.exe") -and (Get-Date) -lt $deadline) {
              Start-Sleep -Seconds 4
            }
            Start-Sleep -Seconds 12
          }
          Stop-Process -Name "terminal64" -Force -ErrorAction SilentlyContinue
          Remove-Item -Path ".\mt5setup.exe" -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          python -m pip install --upgrade pip
          if (Test-Path "requirements.txt") {
            pip install -r requirements.txt
          } else {
            pip install MetaTrader5
          }

      - name: 4. Run Zero-Loss Fortress Bot (v6.0)
        id: bot
        shell: powershell
        env:
          PYTHONIOENCODING: utf-8
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SECRET_ACCESS_KEY: ${{ secrets.SECRET_ACCESS_KEY != '' && secrets.SECRET_ACCESS_KEY || 'vip_secret_99' }}
          DB_ENCRYPTION_KEY: ${{ secrets.DB_ENCRYPTION_KEY != '' && secrets.DB_ENCRYPTION_KEY || 'vip_secret_99_fortress_key' }}
          METAAPI_TOKEN: ${{ secrets.METAAPI_TOKEN }}
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          BYBIT_API_KEY: ${{ secrets.BYBIT_API_KEY }}
          BYBIT_API_SECRET: ${{ secrets.BYBIT_API_SECRET }}
          BYBIT_PROXY_URL: ${{ secrets.BYBIT_PROXY_URL }}
          GROQ_TOKEN: ${{ secrets.GROQ_TOKEN }}
          GROQ_TOKRN: ${{ secrets.GROQ_TOKRN }}
          GEMINI_TOKEN: ${{ secrets.GEMINI_TOKEN }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN != '' && secrets.GH_MODELS_TOKEN || secrets.GITHUB_TOKEN }}
          SAMBANOVA_TOKEN: ${{ secrets.SAMBANOVA_TOKEN }}
          COHERE_TOKEN: ${{ secrets.COHERE_TOKEN }}
          OPENROUTER_TOKEN: ${{ secrets.OPENROUTER_TOKEN }}
          OPENROUTER1_TOKEN: ${{ secrets.OPENROUTER1_TOKEN }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
          BOT_UTC_OFFSET: "3"
          MIN_AI_CONFIDENCE: "92"
        run: |
          python -X utf8 main.py

      - name: 5. Save Database State and Trigger Next 24/7 Cycle
        if: always() && steps.bot.conclusion != 'skipped'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # دمج ملفات WAL المؤقتة داخل قاعدة البيانات الأساسية multi_mt5_gold_bot.db قبل الحفظ
          python -c "import sqlite3, os; conn = sqlite3.connect('multi_mt5_gold_bot.db') if os.path.exists('multi_mt5_gold_bot.db') else None; conn and (conn.execute('PRAGMA wal_checkpoint(TRUNCATE)'), conn.close())" || true

          git config --global user.name "MT5-Cloud-Bot"
          git config --global user.email "bot@users.noreply.github.com"

          if [ -f "multi_mt5_gold_bot.db" ]; then
            git add -f multi_mt5_gold_bot.db || true
          fi
          if [ -f "bot_state_v6.db" ]; then
            git rm -f --ignore-unmatch bot_state_v6.db || true
          fi

          git diff --staged --quiet || git commit -m "Auto-save Zero-Loss Fortress DB state [skip ci]" || true
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || git rebase --abort || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true

          # إعادة تشغيل الدورة التالية تلقائياً لضمان استمرارية 24/7 بلا انقطاع
          if [ "${GITHUB_EVENT_NAME}" != "push" ]; then
            gh workflow run mt5_bot.yml --ref "${GITHUB_REF_NAME}" || true
          fi
