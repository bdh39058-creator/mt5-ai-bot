name: MT5 Multi-Account AI Bot 24/7

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

concurrency:
  group: mt5-ai-telegram-bot
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  run-trading-bot:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Install MetaTrader 5 and Pre-Enable Algo Trading
        shell: powershell
        run: |
          if (!(Test-Path "C:\Program Files\MetaTrader 5\terminal64.exe")) {
            Invoke-WebRequest -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" -OutFile "mt5setup.exe"
            Start-Process -FilePath ".\mt5setup.exe" -ArgumentList "/auto" -Wait
            Start-Sleep -Seconds 15
          }
          Stop-Process -Name "terminal64" -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          python -m pip install --upgrade pip
          pip install MetaTrader5

      - name: 4. Run Multi-Account AI Bot
        env:
          PYTHONIOENCODING: utf-8
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GROQ_TOKEN: ${{ secrets.GROQ_TOKEN }}
          GEMINI_TOKEN: ${{ secrets.GEMINI_TOKEN }}
          COHERE_TOKEN: ${{ secrets.COHERE_TOKEN }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          OPENROUTER1_TOKEN: ${{ secrets.OPENROUTER1_TOKEN }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
          SAMBANOVA_TOKEN: ${{ secrets.SAMBANOVA_TOKEN }}
          METAAPI_TOKEN: ${{ secrets.METAAPI_TOKEN }}
          BYBIT_API_KEY: ${{ secrets.BYBIT_API_KEY }}
          BYBIT_API_SECRET: ${{ secrets.BYBIT_API_SECRET }}
          BYBIT_PROXY_URL: "https://bybit-bridge.bdh39058.workers.dev"
        run: |
          python -X utf8 main.py

      - name: 5. Save Database and Auto-Restart Next 24/7 Cycle
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "MT5-Cloud-Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add multi_mt5_gold_bot.db || true
          git diff --staged --quiet || git commit -m "Auto-save bot state [skip ci]" || true
          git push || true
          gh workflow run mt5_bot.yml || GH_TOKEN="$FALLBACK_TOKEN" gh workflow run mt5_bot.yml || true
