name: MT5 AI Cloud Bot 24/7

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # يتيح لك تشغيل البوت يدوياً متى شئت من جيت هاب

jobs:
  run-bot:
    runs-on: windows-latest  # سيرفر ويندوز مجاني 100% من جيت هاب

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install MetaTrader5 python-telegram-bot requests

    - name: Run MT5 AI Trading Bot
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        GROQ_TOKEN: ${{ secrets.GROQ_TOKEN }}
      run: |
        python main.py
