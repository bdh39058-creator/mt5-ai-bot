name: MT5 Multi-Account AI Bot 24/7

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

concurrency:
  group: mt5-ai-telegram-bot
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run-trading-bot:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: 0. Check Required Secrets
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: |
          missing=0
          for v in TELEGRAM_BOT_TOKEN MT5_LOGIN MT5_PASSWORD MT5_SERVER; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v is missing"; missing=1; fi
          done
          exit $missing

      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Install MetaTrader 5 and Python Packages
        shell: powershell
        run: |
          if (!(Test-Path "C:\Program Files\MetaTrader 5\terminal64.exe")) {
            Invoke-WebRequest -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" -OutFile "mt5setup.exe"
            Start-Process -FilePath ".\mt5setup.exe" -ArgumentList "/auto" -Wait
            Start-Sleep -Seconds 20
          }
          Stop-Process -Name "terminal64" -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          python -m pip install --upgrade pip
          pip install MetaTrader5 numpy

      - name: 4. Run Trading Bot
        env:
          PYTHONIOENCODING: utf-8
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SECRET_ACCESS_KEY: ${{ secrets.SECRET_ACCESS_KEY }}
          GROQ_TOKEN: ${{ secrets.GROQ_TOKEN }}
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: |
          python -X utf8 main.py

      - name: 5. Save State and Restart Next Cycle
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "MT5-Cloud-Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add multi_mt5_gold_bot.db || true
          git diff --staged --quiet || git commit -m "Auto-save bot state [skip ci]" || true
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
          if [ -f restart.flag ]; then
            gh workflow run mt5_bot.yml --ref "${GITHUB_REF_NAME}" || true
          else
            echo "البوت لم ينهِ دورته بشكل طبيعي: لا إعادة تشغيل فورية (الـ cron سيحاول لاحقاً)"
          fi
