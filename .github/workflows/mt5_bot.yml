name: MT5 Telegram Multi-Account Bot 24/7

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

concurrency:
  group: mt5-ai-telegram-bot
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: write
  actions: write

jobs:
  run-trading-bot:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: 0. Check Required Secrets
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SECRET_ACCESS_KEY: ${{ secrets.SECRET_ACCESS_KEY }}
          DB_ENCRYPTION_KEY: ${{ secrets.DB_ENCRYPTION_KEY }}
        run: |
          fail=0
          check() {
            if [ -z "$2" ]; then
              echo "::error::السر $1 غير موجود. أضفه من Settings > Secrets and variables > Actions > New repository secret (Repository secret وليس Variable)"
              fail=1
            elif [ ${#2} -lt $3 ]; then
              echo "::error::السر $1 قصير جداً، الحد الأدنى $3 حرفاً"
              fail=1
            fi
          }
          check TELEGRAM_BOT_TOKEN "$TELEGRAM_BOT_TOKEN" 20
          check SECRET_ACCESS_KEY "$SECRET_ACCESS_KEY" 6
          check DB_ENCRYPTION_KEY "$DB_ENCRYPTION_KEY" 16
          exit $fail

      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Install MetaTrader 5 and Python Packages
        shell: powershell
        run: |
          if (!(Test-Path "C:\Program Files\MetaTrader 5\terminal64.exe")) {
            Invoke-WebRequest -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" -OutFile "mt5setup.exe"
            Start-Process -FilePath ".\mt5setup.exe" -ArgumentList "/auto" -Wait
            Start-Sleep -Seconds 20
          }
          Stop-Process -Name "terminal64" -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          python -m pip install --upgrade pip
          pip install MetaTrader5 numpy cryptography

      - name: 4. Run Bot Manager
        id: bot
        env:
          PYTHONIOENCODING: utf-8
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SECRET_ACCESS_KEY: ${{ secrets.SECRET_ACCESS_KEY }}
          DB_ENCRYPTION_KEY: ${{ secrets.DB_ENCRYPTION_KEY }}
          BOT_UTC_OFFSET: "2"
          MAX_ACCOUNTS: "6"
        run: |
          python -X utf8 main.py

      - name: 5. Save State and Restart Next Cycle
        if: always() && steps.bot.conclusion != 'skipped'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DB_ENCRYPTION_KEY: ${{ secrets.DB_ENCRYPTION_KEY }}
        run: |
          python -X utf8 main.py snapshot || true
          git config --global user.name "MT5-Cloud-Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add bot_state_v6.db || true
          git diff --staged --quiet || git commit -m "Auto-save bot state [skip ci]" || true
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || git rebase --abort || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
          if [ -f restart.flag ]; then
            gh workflow run mt5_bot.yml --ref "${GITHUB_REF_NAME}" || true
          fi
